<style>
/* VOICE   Quiet and exact, a printed page of record: Tufte's books.
   IDEA    The newspaper agate page: every game a line of type with a sparkline.
   PICTURE Word-sized margin sparklines on one scale per league; a rug of every score.
   COLOUR  Paper and ink; one red-brown for home leads, one slate for away leads; a highlighter for news.
   TYPE    EB Garamond throughout, lining tabular figures for numbers.
   LAYOUT  A text column of tables with a margin of sidenotes (the scoring feed). */
:root {
  color-scheme: light dark;
  --bg: light-dark(#fffff8, #1d1c1a);
  --ink: light-dark(#111111, #e8e5dc);
  --gray: light-dark(#6f6d66, #9c998f);
  --rule: light-dark(#d8d5c8, #3b3933);
  --home: light-dark(#9b2d26, #e3867c);
  --away: light-dark(#2e5a87, #8fb5e2);
  --hot: light-dark(#fff0a0, #4b4220);
  --band: light-dark(#1d1c1a, #1d1c1a);
  --band-ink: #fffff8;
  --band-red: #e3867c;
  --band-blue: #8fb5e2;
  --band-gray: #a19c8f;
  --serif: "EB Garamond", "Palatino", "Palatino Linotype", "Book Antiqua", Georgia, serif;
  --data: "Source Serif 4", "Source Serif Pro", Georgia, var(--serif);
}
/* Two faces, one rule: the figures and the names (what the page reports) are
   set in Source Serif 4, sturdy and clear at a glance; the words about them
   (captions, notes, labels, everything in italic) stay in EB Garamond. */
header h1, .livec b, .leagues .pick, .days .lbl, .days input,
table.agate td.tm, table.agate td.sc, table.agate td.st, table.agate td.when, table.agate td.mu, table.agate th.lg,
:is(header, .pinbar) .pin .ab, :is(header, .pinbar) .pin .n,
.dteam .nm, .dteam .big, .dmid .live, .dmid .wp b,
table.stats td, table.stats th, table.plays-t td.t, table.plays-t td.s, .night .v b, .feed li b,
.phead .jn, .phead .pn, .thead .pn, .dsum, .find li > span:nth-child(2), .find input, .tleaders a, .standings td, .f1 .nm,
.big, .h2n, h2 > .c { font-family: var(--data); }
:is(table.agate, .dhead, table.stats, .pin, .night, .standings) :is(em, i, .rec, .cap) ,
table.agate th.lg span, table.agate td.st.live em { font-family: var(--serif); }
:root[data-theme=light] { color-scheme: light; }
:root[data-theme=dark] { color-scheme: dark; }
* { box-sizing: border-box; min-width: 0; }
html { overflow-x: clip; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.45 var(--serif); overflow-x: clip;
  font-variant-numeric: lining-nums tabular-nums; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
#pal, [hidden] { display: none !important; }
.wrap { max-width: 1240px; margin: 0 auto; padding: env(safe-area-inset-top, 0px) max(4vw, 16px, env(safe-area-inset-right, 0px)) calc(48px + env(safe-area-inset-bottom, 0px)) max(4vw, 16px, env(safe-area-inset-left, 0px)); }

/* Masthead: the name large on its own line over a rule, then one dateline
   with the status left and the controls right, all on one left edge. */
/* Masthead: a dark band, like a stadium board, holding the name, the live
   count and every score of the last half hour standing on its baseline;
   beneath it, on the paper, one dateline with the controls. The band runs
   to the screen's edges and under the phone's status bar. */
header { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 0 16px; -webkit-app-region: drag; }
header .band { grid-column: 1 / -1; color: var(--band-ink); position: relative; isolation: isolate; padding-top: 14px; }
/* The band's colour runs edge to edge on a layer behind it; the band itself keeps
   the page's width, so nothing inside depends on viewport arithmetic (which
   iPhone home-screen apps got wrong, squeezing the masthead's right side). */
header .band::before { content: ""; position: absolute; z-index: -1; top: 0; bottom: 0; left: 50%; width: 100vw;
  transform: translateX(-50%); background: var(--band); }
/* iOS blurs and fades whatever a page draws under the status bar, in Safari
   and in home-screen apps alike, so nothing is drawn there. In Safari the
   paper shows under it. */
/* iOS 26.1+ ignores the status-bar meta and paints the strip under the clock in the
   BODY's background colour (WebKit bug 301756). So in the home-screen app the body
   wears the masthead colour, and the cream page sits on the content wrapper instead. */
html.standalone, html.standalone body { background: var(--band); }
/* once the masthead has scrolled away, the strip turns to paper to match what's under it */
html.standalone.past-band body { background: var(--bg); }
html.standalone .wrap { background: linear-gradient(var(--band) 0 env(safe-area-inset-top, 0px), var(--bg) 0); min-height: 100vh; }
header .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.livec { font-size: 15px; font-style: italic; color: var(--band-gray); white-space: nowrap; }
.livec b { font-style: normal; font-size: 30px; font-weight: 500; color: var(--band-ink); margin-right: 4px; font-variant-numeric: lining-nums; }
/* The canvas is taken out of layout so its pixel size never feeds back
   into the grid's width. */
header .band, header .row { min-width: 0; }
:is(header, .pinbar) .pin { display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; margin: 8px 0 0; padding: 7px 0 1px; border-top: 1px solid rgba(255, 255, 248, 0.18);
  cursor: pointer; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; font-variant-numeric: lining-nums tabular-nums; }
:is(header, .pinbar) .pin .side { display: inline-flex; align-items: baseline; gap: 7px; }
:is(header, .pinbar) .pin .sw { width: 4px; height: 18px; align-self: center; margin: 0; }
:is(header, .pinbar) .pin .ab { font-size: 18px; font-weight: 500; letter-spacing: 0.03em; }
:is(header, .pinbar) .pin .n { font-size: 30px; line-height: 1; color: var(--band-gray); }
:is(header, .pinbar) .pin .n.up { color: var(--band-ink); font-weight: 600; }
:is(header, .pinbar) .pin .det { margin-left: auto; text-align: right; font-style: italic; font-size: 15px; color: var(--band-gray); white-space: nowrap; }
:is(header, .pinbar) .pin.live .det { color: var(--band-ink); font-style: normal; }
/* The pinned game, stuck to the top once its place in the masthead scrolls away.
   As it sticks, the game's margin line (Polymarket band behind) draws out to the right of the score. */
.pinbar { position: fixed; left: 0; right: 0; top: 0; z-index: 40; background: var(--band); color: var(--band-ink);
  padding-top: env(safe-area-inset-top, 0px); visibility: hidden; pointer-events: none; }
@media (pointer: coarse) { .pinbar { padding-top: calc(env(safe-area-inset-top, 0px) + 28px); } }
.stuck .pinbar { visibility: visible; pointer-events: auto; }
.pinbar .pin { margin: 0; padding-bottom: 7px; border-top-color: transparent; }
.pinbar .in { position: relative; }
/* the margin line's palette, turned for the dark bar */
.pinbar { --bg: var(--band); --ink: var(--band-ink); --gray: var(--band-gray); --rule: rgba(255, 255, 248, 0.28);
  --home: var(--band-red); --away: var(--band-blue); }
/* the pinned game's margin line, drawn beside the score while the bar is stuck */
.pinbar .mini { position: absolute; display: block; pointer-events: none; transform-origin: 0 0; }

.status.note { color: var(--ink); }
/* On phones it behaves like an app: a long press never selects text or pops
   the copy menu (holding a game pins it). Fields stay editable. */
@media (pointer: coarse) {
  html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
}
tr.row { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
tr.row.pinned td:first-child { box-shadow: inset 3px 0 0 var(--ink); padding-left: 6px; }
header .rugbox { position: relative; height: 30px; margin-top: 8px; }
header .rugbox canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
header .rcap { display: flex; justify-content: space-between; font-size: 12px; font-style: italic; color: var(--band-gray); padding: 2px 0 7px; }
header .rcap b { font-style: normal; color: var(--band-ink); font-weight: 500; }
header button { -webkit-app-region: no-drag; }
.app header { padding-left: 64px; }
/* ScoreCard set tight, as a wordmark: the whole word drawn in by 3.5% of an
   em, with a hair of space (a tenth of an em) where the red Score meets Card. */
h1 .sc-s { color: var(--band-red); margin-right: 0.1em; }
h1 { font-kerning: normal; font-feature-settings: "kern" 1, "liga" 1; }
h1 { margin: 0 0 0 -0.04em; color: var(--band-ink); font-weight: 500; font-size: clamp(40px, 11vw, 60px); line-height: 1.1; letter-spacing: -0.035em; }
.status { font-style: italic; color: var(--gray); font-size: 15px; padding: 7px 0 2px; min-width: 0; }
.status.err { color: var(--home); }
.tools { display: flex; gap: 14px; }
.tools .link { font-size: 15px; min-height: 36px; }
.link { color: var(--gray); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; min-height: 32px; font-size: 16px; }
.link:hover, .link[aria-pressed="true"] { color: var(--ink); text-decoration-color: var(--ink); }
.cta { border: 1px solid var(--ink); padding: 4px 14px; font-size: 16px; min-height: 36px; }
.cta:hover { background: var(--ink); color: var(--bg); }

.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin: 10px 0 4px; padding: 10px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.banner p { margin: 0; flex: 1 1 360px; font-style: italic; color: var(--gray); }
.banner strong { font-style: normal; font-weight: 500; color: var(--ink); }

header .tools { padding-top: 2px; }
header + .banner, header ~ .days { margin-top: 4px; }

.leagues { display: flex; flex-wrap: wrap; gap: 2px 20px; padding: 8px 0; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule); }
.league { display: flex; align-items: baseline; gap: 4px; }
.league .pick { font-size: 16px; color: var(--gray); min-height: 34px; letter-spacing: 0.04em; }
.league .pick .n { font-size: 14px; margin-left: 4px; }
.league .pick .n.live { color: var(--home); }
.league .pick:hover, .league.on .pick { color: var(--ink); }
.league.on .pick { text-decoration: underline; text-underline-offset: 5px; }
.league .err { color: var(--home); font-size: 14px; }
.league.off .pick { color: color-mix(in srgb, var(--gray) 50%, var(--bg)); }
.league.off .pick .n { font-style: italic; }
.league.off.on .pick { color: var(--gray); }
.league.off .ico { visibility: hidden; }
.ico { color: var(--rule); display: inline-grid; place-items: center; width: 22px; height: 30px; align-self: center; }
.ico svg { width: 13px; height: 13px; }
.ico:hover { color: var(--gray); }
.ico[aria-pressed="true"] { color: var(--ink); }

.board { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 40px; align-items: start; margin-top: 18px; }
@media (max-width: 960px) { .board { grid-template-columns: minmax(0, 1fr); gap: 24px; } }
h2 { margin: 0 0 2px; font-weight: 400; font-style: italic; font-size: 26px; }
h2 .c { font-style: normal; color: var(--gray); font-size: 18px; margin-left: 6px; }
.note { margin: 0 0 10px; color: var(--gray); font-size: 15px; font-style: italic; }
.group + .group { margin-top: 30px; }
.night .nls { border-top: 1px solid var(--ink); }
.night .nl { display: grid; grid-template-columns: 6.2em minmax(0, 1fr) 120px; gap: 4px 12px; align-items: center; padding: 7px 0;
  border-bottom: 1px solid color-mix(in srgb, var(--rule) 45%, transparent); cursor: pointer; }
.night .nl:hover { background: color-mix(in srgb, var(--rule) 25%, transparent); }
.night .k { font-style: italic; color: var(--gray); font-size: 15px; }
.night .v b { font-weight: 600; letter-spacing: 0.03em; }
.night .v i { color: var(--gray); font-size: 14px; }
.night .nsp { display: block; width: 120px; height: 22px; }
@media (max-width: 560px) { .night .nl { grid-template-columns: 5.2em minmax(0, 1fr) 64px; } .night .nsp { width: 64px; } .night .v { font-size: 15px; } }
.empty { color: var(--gray); font-style: italic; padding: 20px 0; }

table.agate { border-collapse: collapse; width: 100%; font-size: 16px; }
table.agate th.lg { text-align: left; font-weight: 500; font-size: 14px; letter-spacing: 0.08em; padding: 12px 0 3px; border-bottom: 1px solid var(--ink); }
table.agate th.lg span { font-weight: 400; letter-spacing: 0; color: var(--gray); font-style: italic; margin-left: 8px; }
table.agate td { padding: 3px 6px; white-space: nowrap; vertical-align: middle; border-bottom: 1px solid color-mix(in srgb, var(--rule) 45%, transparent); }
table.agate tr.row { cursor: pointer; }
table.agate tr.row:hover td { background: color-mix(in srgb, var(--rule) 25%, transparent); }
table.agate tr.hot td { animation: hot 6s ease-out both; }
table.agate tr.dv td { padding: 9px 0 1px; font-style: italic; font-size: 14px; color: var(--gray); border-bottom: 0; }
td.tm { width: 1%; font-weight: 500; letter-spacing: 0.03em; }
td.tm.a { padding-left: 0; }
.sw { display: inline-block; width: 4px; height: 15px; margin-right: 6px; vertical-align: -2px; border-radius: 1px; }
.fav { display: inline-flex; align-items: center; gap: 2px; margin-left: 4px; color: var(--gray); font-weight: 400; font-size: 12px; vertical-align: 1px; }
.fav svg { width: 12px; height: 12px; }
.fav span { color: var(--gray); }
td.sc { width: 1%; text-align: right; font-size: 18px; color: var(--gray); }
td.sc.lead { color: var(--ink); font-weight: 600; }
td.sc.h { text-align: left; }
/* the sparkline grows with the window: it shares the spare width with the last-play note */
td.sp { width: 42%; min-width: 120px; padding: 2px 6px; }
/* the line's width is set outright (browsers share a table's spare room
   differently), the same in every league's table */
table.agate td.sp canvas { width: clamp(160px, 26vw, 320px); }
/* steady widths around it, so sparklines line up from league to league */
td.tm.a { min-width: 3.4em; } td.tm:not(.a) { min-width: 6.2em; } td.st { min-width: 4.6em; }
td.sp canvas { display: block; width: 100%; height: 24px; }
td.st { width: 1%; font-size: 15px; color: var(--gray); font-style: italic; }
td.st.live { color: var(--ink); font-style: normal; }
td.lp { font-size: 14px; color: var(--gray); max-width: 0; width: 100%; overflow: hidden; text-overflow: ellipsis; }
td.when { width: 1%; color: var(--gray); font-size: 15px; padding-left: 0; }
td.mu { font-weight: 500; }
td.mu .at { font-weight: 400; color: var(--gray); font-style: italic; margin: 0 6px; }
td.mu .rec { font-weight: 400; color: var(--gray); font-size: 14px; margin-left: 4px; }
@media (max-width: 700px) {
  td.lp { display: none; }
  td.sp { width: 100%; min-width: 64px; }
  td.st { font-size: 14px; }
  table.agate td.sp canvas { width: calc(100vw - 2 * max(4vw, 16px) - 330px); }
}
@media (max-width: 560px) {
  /* phones: the sparkline takes all the width the row has left over, rather than a fixed 64 px */
  td.sp { width: 100%; min-width: 64px; padding: 2px 6px; } td.sp canvas { width: 100%; }
  /* Safari hands a table's spare width to every column, not to the one marked
     100%, so the line's width is set outright: the page width less the fixed
     columns (220 px) and a little slack. */
  table.agate td.sp canvas { width: calc(100vw - 2 * max(4vw, 16px) - 252px); max-width: none; }
  /* fixed widths around it so every league's sparklines line up */
  /* in pixels, not ems, so nothing about the type can widen them; the
     sparkline gets everything else */
  /* Source Serif runs wider than Garamond: a size smaller and tighter here,
     so four-letter names fit their columns and nothing pushes on the line */
  table.agate td.tm { font-size: 15px; letter-spacing: 0.01em; }
  table.agate td.sc { font-size: 17px; }
  table.agate td.tm.a { width: 56px; min-width: 56px; }
  table.agate td.tm:not(.a) { width: 68px; min-width: 68px; }
  table.agate td.sc { width: 22px; min-width: 22px; }
  table.agate td.st { width: 56px; min-width: 56px; max-width: 56px; white-space: normal; overflow-wrap: anywhere; line-height: 1.15; font-size: 12px; }
  .fav span { display: none; }
  td.mu .rec { display: none; }
  table.agate td { padding: 3px 3px; }
}

.f1 { margin-bottom: 14px; }
.f1 .f1h { font-weight: 500; font-size: 14px; letter-spacing: 0.08em; padding: 12px 0 3px; border-bottom: 1px solid var(--ink); }
.f1 .row2.small { grid-template-columns: minmax(0, 1fr) 84px; }
.f1 .ev { cursor: pointer; padding: 6px 0 10px; border-bottom: 1px solid var(--rule); }
.f1 .ev:hover { background: color-mix(in srgb, var(--rule) 25%, transparent); }
.f1 .nm { font-size: 19px; font-weight: 500; }
.f1 .ss { color: var(--gray); font-size: 15px; font-style: italic; }
.f1 .ss b { font-style: normal; font-weight: 500; color: var(--ink); }
.f1 ol { list-style: none; margin: 6px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 0 12px; font-size: 16px; }
.f1 li .p { color: var(--gray); display: inline-block; width: 1.6em; text-align: right; margin-right: 6px; }
.f1 li:first-child { font-weight: 600; }
.f1 .ex { font-size: 13px; color: var(--gray); font-style: italic; }

.foot { margin-top: 40px; padding-top: 8px; border-top: 1px solid var(--rule); font-size: 13px; color: var(--gray); font-style: italic; }
.feed h2 { font-size: 20px; margin-bottom: 4px; }
.feed ol { list-style: none; margin: 0; padding: 0; max-height: 78vh; overflow-y: auto; }
.feed li { padding: 5px 0 6px; border-top: 1px solid color-mix(in srgb, var(--rule) 60%, transparent); font-size: 15px; line-height: 1.35; }
.feed li:first-child { border-top: 0; }
.feed li.new { animation: hot 6s ease-out both; }
.feed time { color: var(--gray); font-size: 14px; margin-right: 6px; }
.feed .b { font-weight: 600; margin-right: 4px; }
.feed .t { font-weight: 500; }
.feed .t.home { color: var(--home); } .feed .t.away { color: var(--away); }
.feed .l { display: block; color: var(--gray); font-style: italic; font-size: 14px; }
.feed .none { color: var(--gray); font-style: italic; font-size: 15px; margin: 0; }
@media (min-width: 961px) { .feed { position: sticky; top: 16px; } }

.detail { display: grid; gap: 16px; margin-top: 8px; }
.detail .back { justify-self: start; }
.dhead { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 20px; align-items: end; border-bottom: 1px solid var(--ink); padding-bottom: 10px; }
.dteam { display: grid; min-width: 0; }
.dteam.home { text-align: right; justify-items: end; }
/* long names wrap to a second line, and only then are cut short */
.dteam .tlink { display: block; min-width: 0; max-width: 100%; }
.dteam .nm { font-size: 18px; line-height: 1.15; overflow: hidden; max-width: 100%; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; }
.dteam .rec { font-size: 14px; font-style: italic; color: var(--gray); line-height: 1.2; }
.dteam .big { font-size: clamp(44px, 8vw, 72px); line-height: 1; }
.dteam.away .nm { color: var(--away); } .dteam.home .nm { color: var(--home); }
.dmid { text-align: center; color: var(--gray); font-style: italic; padding-bottom: 8px; }
.dmid .lg { display: block; font-style: normal; letter-spacing: 0.08em; font-size: 14px; color: var(--ink); }
.dmid .live { display: block; font-style: normal; color: var(--ink); font-weight: 500; }
.dmid .wp { display: block; margin-top: 4px; font-size: 15px; }
.dmid .wp b { font-style: normal; font-weight: 600; font-variant-numeric: lining-nums tabular-nums; }
.plays { margin: 14px 0 6px; }
.plays h3 { font-weight: 500; font-size: 14px; letter-spacing: 0.08em; margin: 0 0 2px; padding-bottom: 3px; border-bottom: 1px solid var(--ink); }
.plays h3 .c { letter-spacing: 0; font-style: italic; color: var(--gray); font-weight: 400; margin-left: 6px; }
table.plays-t { border-collapse: collapse; width: 100%; font-size: 15px; }
table.plays-t td { padding: 5px 6px; border-bottom: 1px solid color-mix(in srgb, var(--rule) 45%, transparent); vertical-align: baseline; }
table.plays-t td.w { white-space: nowrap; color: var(--gray); font-style: italic; font-size: 14px; padding-left: 0; }
table.plays-t td.t { white-space: nowrap; font-weight: 500; letter-spacing: 0.03em; }
table.plays-t td.x { width: 100%; color: var(--ink); }
table.plays-t td.s { white-space: nowrap; text-align: right; color: var(--gray); font-variant-numeric: lining-nums tabular-nums; padding-right: 0; }

<script>
(function () {

  // ---- Leagues ---------------------------------------------------------
  // ESPN's public scoreboard feeds; college feeds take groups (80 FBS, 81

  // seconds per period; up: clock counts up (soccer); innings: baseball;
  // unit: the smallest margin a league's sparklines are scaled to;

  var LEAGUES = [
    { key: "nfl", label: "NFL", paths: ["football/nfl"], sport: "football", bell: true, n: 4, len: 900, unit: 14, pl: "Q" },

    else note.textContent = "";
    if (!tablesToo || !bx) return;
    var key = box.key + ":" + box.at + ":" + (P ? P.ink : "");
    if (key === tablesKey) return;
    tablesKey = key;
    var ordered = bt.slice().sort(function (a, b) { return (a.home ? 1 : 0) - (b.home ? 1 : 0); });
    var scale = boxScale(ordered), p = pal();
    $("dtables").replaceChildren.apply($("dtables"), ordered.filter(function (t) { return t.groups && t.groups.length; }).map(function (t) {
      var which = t.home ? "home" : "away", base = tc ? tc[which] : p[which], color = alpha(base, 0.14);
      return h("section", { class: "tbox " + which }, [h("h2", { style: "color:" + base }, [teamLink(l, t.id, document.createTextNode(t.name || t.abbr || ""))])].concat(t.groups.map(function (g) {
        var title = ({ Kickreturns: "Kick returns", Puntreturns: "Punt returns", Defenses: "Defense", Defensive: "Defense" })[g.name] || g.name;
        return h("div", null, [h("h3", { text: title }), statTable(g, color, scale)]);
      })));
    }));
  }

  // ---- App setup ---------------------------------------------------------
  pressable($("pin"), function (e) { var p = prefs.pin, l = p && BY_KEY[p.l]; if (!l) return; var ab = e && e.target && e.target.closest && e.target.closest(".ab[data-team]");
    if (ab) { backTo = location.hash; location.hash = "team-" + l.key + "-" + ab.getAttribute("data-team"); } else openGame(l, { id: p.id }); },

  $("sound").addEventListener("click", function () {

  });
  var STANDALONE = !!(navigator.standalone || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches));

  // iOS colours the strip under the clock from the page background, so swap

  var stuck = false, stickQueued = false, stickQueuedByScroll = false;
  function stickTop() { return parseFloat(getComputedStyle($("pinbar")).paddingTop) || 0; }

    var pc = $("pinc"), sides = pc.querySelectorAll(".side"), det = pc.querySelector(".det");

  }

  function drawPinMargin() {
    var m = $("pinm"), p = prefs.pin, l = p && BY_KEY[p.l], ev = l && findEvent(l, p.id);

    var keep = P, bp = {};
    document.querySelectorAll("#palb i").forEach(function (i) { bp[i.dataset.k] = getComputedStyle(i).color; });

    return true;
  }
  function placeMini() {
    var m = $("pinm"), inn = $("pinbar").firstElementChild, slot = miniSlot();

    m.style.width = slot.width + "px"; m.style.height = slot.height + "px";
    if (!drawPinMargin()) { m.hidden = true; return false; }

  }
  function stick(on) {
    var root = document.documentElement, bar = $("pinbar"), m = $("pinm");
    stuck = on;
    if (on) {
      var r = $("pin").getBoundingClientRect(), inn = bar.firstElementChild;
      inn.style.marginLeft = r.left + "px"; inn.style.width = r.width + "px";
      root.classList.add("stuck");
      root.style.setProperty("--pinbar-h", ($("pinc").offsetHeight + stickTop()) + "px");
      if (placeMini() && m.animate && !matchMedia("(prefers-reduced-motion: reduce)").matches)
        // the line draws out from the score, left to right
        m.animate([{ clipPath: "inset(0 100% 0 0)", opacity: 0.4 }, { clipPath: "inset(0 0 0 0)", opacity: 1 }],
          { duration: 520, easing: "cubic-bezier(.3,.7,.2,1)" });
    } else {
      root.classList.remove("stuck");
      root.style.removeProperty("--pinbar-h");
    }
  }
  function checkStick() {
    stickQueued = false;
    var pin = $("pin"), want = false;
    if (pin && !pin.hidden && pin.offsetParent) want = pin.getBoundingClientRect().top < stickTop() - 0.5;
    if (want !== stuck) stick(want);
    else if (stuck && !stickQueuedByScroll) { document.documentElement.style.setProperty("--pinbar-h", ($("pinc").offsetHeight + stickTop()) + "px"); placeMini(); }
    stickQueuedByScroll = false;
    if (STANDALONE) {
      var band = document.querySelector("header .band");
      var past = !!band && band.getBoundingClientRect().bottom < 4 && !stuck;
      if (past !== document.documentElement.classList.contains("past-band")) {
        document.documentElement.classList.toggle("past-band", past);
        if (typeof applyTheme === "function") applyTheme();
      }
    }
  }
  addEventListener("scroll", function () { if (!stickQueued) { stickQueued = true; stickQueuedByScroll = true; requestAnimationFrame(checkStick); } }, { passive: true });
  addEventListener("resize", function () {
    // re-measure quietly: no replaying the draw-out on every resize step
    if (stuck) { var r = $("pin").getBoundingClientRect(), inn = $("pinbar").firstElementChild; inn.style.marginLeft = r.left + "px"; inn.style.width = r.width + "px"; placeMini(); }
    checkStick();
  });
  addEventListener("hashchange", function () { setTimeout(checkStick, 50); });
  // ---- Find a team -----------------------------------------------------
  // Every team in every league, from teams.json (built weekly beside the
  // app, since ESPN's team lists can't be read from a page). Pull down from
  // the top, tap Find, or press / to search; a result opens the team.
  var teamsIdx = null, teamsLoading = null;
  function loadTeams() {
    if (teamsIdx || teamsLoading) return teamsLoading;
    teamsLoading = fetch("teams.json", { cache: "no-cache" }).then(function (r) { return r.json(); })
      .then(function (a) { teamsIdx = a.filter(function (t) { return BY_KEY[t[0]]; }).map(function (t) {
        return { l: t[0], id: t[1], ab: t[2], name: t[3], short: t[4], color: t[5], q: (t[2] + " " + t[3] + " " + t[4]).toLowerCase() }; }); runFind(); })
      .catch(function () { $("findh").textContent = "Couldn't load the team list."; });
    return teamsLoading;
  }
  var findSel = 0, findHits = [];
  function runFind() {
    var q = $("findq").value.trim().toLowerCase(), ul = $("findr"), hint = $("findh");
    if (!teamsIdx) { ul.replaceChildren(); hint.textContent = "Loading teams…"; return; }
    var favs = prefs.favs || {};
    if (!q) {
      findHits = Object.keys(favs).map(function (k) { var f = favs[k]; return teamsIdx.filter(function (t) { return t.l === f.l && String(t.id) === String(f.id); })[0]; }).filter(Boolean);
      hint.textContent = findHits.length ? "Your favourites. Type to find any team." : "Type a team, city or abbreviation: Lions, Detroit, DET.";
    } else {
      var order = {}; LEAGUES.forEach(function (l, i) { order[l.key] = i; });
      findHits = teamsIdx.map(function (t) {
        var sc = t.ab.toLowerCase() === q ? 0 : t.short.toLowerCase().indexOf(q) === 0 ? 1 : t.name.toLowerCase().indexOf(q) === 0 ? 2
          : (" " + t.q).indexOf(" " + q) >= 0 ? 3 : t.q.indexOf(q) >= 0 ? 4 : 9;
        return { t: t, sc: sc + (favs[t.l + ":" + t.id] ? -0.5 : 0) };
      }).filter(function (x) { return x.sc < 9; }).sort(function (a, b) { return a.sc - b.sc || order[a.t.l] - order[b.t.l] || a.t.name.localeCompare(b.t.name); })
        .slice(0, 24).map(function (x) { return x.t; });
      hint.textContent = findHits.length ? "" : "No team matches “" + $("findq").value.trim() + "”.";
    }
    findSel = Math.min(findSel, Math.max(0, findHits.length - 1));
    ul.replaceChildren.apply(ul, findHits.map(function (t, i) {
      var l = BY_KEY[t.l];
      return h("li", { class: i === findSel ? "on" : null, onclick: function () { goTeam(t); } }, [
        h("span", { class: "sw", style: "background:" + (t.color ? "#" + t.color : "transparent") }),
        h("span", null, [t.name, favs[t.l + ":" + t.id] ? h("span", { class: "fv", text: "★" }) : null]),
        h("span", { class: "lg", text: l.label })]);
    }));
  }
  function goTeam(t) { closeFind(); backTo = location.hash; location.hash = "team-" + t.l + "-" + t.id; }
  function openFind() {
    var f = $("find"); if (!f.hidden) return;
    f.hidden = false; $("findq").value = ""; findSel = 0; runFind(); loadTeams();
    setTimeout(function () { $("findq").focus(); }, 30);
  }
  function closeFind() { $("find").hidden = true; $("findq").blur(); }
  $("findb").addEventListener("click", openFind);
  $("findx").addEventListener("click", closeFind);
  $("find").addEventListener("click", function (e) { if (e.target === $("find")) closeFind(); });
  $("findq").addEventListener("input", function () { findSel = 0; runFind(); });
  $("findq").addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeFind();
    else if (e.key === "ArrowDown") { e.preventDefault(); findSel = Math.min(findHits.length - 1, findSel + 1); runFind(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); findSel = Math.max(0, findSel - 1); runFind(); }
    else if (e.key === "Enter" && findHits[findSel]) goTeam(findHits[findSel]);
  });
  addEventListener("keydown", function (e) {
    var typing = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || "");
    if (e.key === "/" && !typing && $("find").hidden) { e.preventDefault(); openFind(); }
    else if (e.key === "Escape" && !$("find").hidden) closeFind();
    else if (!typing && !view && $("find").hidden && !e.metaKey && !e.ctrlKey && !e.altKey && (e.key === "ArrowLeft" || e.key === "ArrowRight")) swipeDay(e.key === "ArrowLeft" ? -1 : 1);
  });
  // Pull down from the top of the page to search.
  (function () {
    var y0 = null, x0 = 0, hint = $("pullhint"), armed = false;
    addEventListener("touchstart", function (e) {
      y0 = window.scrollY <= 0 && $("find").hidden && e.touches.length === 1 && !e.target.closest(".leagues, input, .scroll") ? e.touches[0].clientY : null;
      x0 = y0 == null ? 0 : e.touches[0].clientX; armed = false;
    }, { passive: true });
    addEventListener("touchmove", function (e) {
      if (y0 == null) return;
      var dy = e.touches[0].clientY - y0, dx = Math.abs(e.touches[0].clientX - x0);
      if (dx > 40 || window.scrollY > 0) { y0 = null; hint.style.opacity = 0; return; }
      var k = Math.max(0, Math.min(1, (dy - 20) / 70));
      armed = k >= 1;
      hint.style.opacity = k; hint.style.transform = "translate(-50%," + (-40 + 40 * k) + "px)";
      hint.textContent = armed ? "Release to find a team" : "Pull to find a team";
    }, { passive: true });
    addEventListener("touchend", function () {
      if (y0 == null) return;
      y0 = null; hint.style.opacity = 0; hint.style.transform = "translate(-50%,-40px)";
      if (armed) { armed = false; openFind(); }
    }, { passive: true });
  })();
  // ---- Swipe between days -------------------------------------------------
  // On the scores, a sideways swipe moves a day: left for the next, right
  // for the one before. The page slides off the way the finger went and
  // the new day slides in behind it.
  function swipeDay(n) {
    var g = $("board"), d = dayDate(); d.setDate(d.getDate() + n);
    var rm = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (rm || !g.animate) { setDay(ymd(d), n); return; }
    g.animate([{ transform: "translateX(0)", opacity: 1 }, { transform: "translateX(" + (-n * 48) + "px)", opacity: 0 }], { duration: 160, easing: "ease-in", fill: "forwards" })
      .onfinish = function (e) { setDay(ymd(d), n); try { e.target.cancel(); } catch (x) {} };
  }
  (function () {
    var sx = 0, sy = 0, t0 = 0, ok = false;

  pressable($("pinc"), function (e) { var p = prefs.pin, l = p && BY_KEY[p.l]; if (!l) return; var ab = e && e.target && e.target.closest && e.target.closest(".ab[data-team]");

    function () { unpin(); });
  // Theme: auto follows the phone; light and dark override it on this device.

  }

    prefs.theme = ({ auto: "light", light: "dark", dark: "auto" })[prefs.theme] || "light"; savePrefs(); applyTheme();
  });
  applyTheme();
  function soundButton() { var s = $("sound"); s.setAttribute("aria-pressed", String(prefs.sound)); s.textContent = prefs.sound ? "Sound on" : "Sound off"; }
  soundButton();
  $("alerts").addEventListener("click", function () {
    if (!("Notification" in window)) return;
    Notification.requestPermission().then(renderAlertsButton).catch(function () {});
  });
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { clearTimeout(timer); poll(); } });

  setInterval(function () { if (moving) return; if (mode === "live") renderStatus(); drawRug(); }, 1000);
  var rt = null;
  // Only a change of width redraws the page. iPhones fire resize when the
  // bars at the top change, which re-rendered every line for nothing.
  var lastW = window.innerWidth;
  window.addEventListener("resize", function () { if (window.innerWidth === lastW) return; lastW = window.innerWidth; clearTimeout(rt); rt = setTimeout(render, 150); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { render(); });

  window.addEventListener("hashchange", route);
  // Updates: a home-screen app keeps the page it loaded, so on every return
  // to the app (and every 10 minutes) ask for version.json, bypassing caches,
  // and reload when a newer version is published.
  var VERSION = (document.querySelector('meta[name="agate-version"]') || {}).content || "dev";
  $("foot").textContent = "ScoreCard, version " + VERSION + (STANDALONE ? ", running as a home-screen app" : ", running in the browser") + ". Scores from ESPN, markets from Polymarket, F1 results from Jolpica.";
  async function checkVersion() {
    if (VERSION === "dev") return;
    try {
      var r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
      var v = (await r.json()).v;

  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) checkVersion(); });

  setInterval(checkVersion, 600000);
  route();
  poll();
  loadCircuits();
  loadStandings();
  loadGridMap();
  setInterval(function () { if (!document.hidden && Date.now() - standingsAt > 600000) loadStandings(); }, 60000);
})();
