<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agate</title>
<meta name="theme-color" content="#fffff8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agate">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json?v=agate">
<link rel="apple-touch-icon" href="agate-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="agate-180.png">
<link rel="icon" href="agate-favicon.png">
<link rel="icon" href="agate-192.png" sizes="192x192">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* VOICE   Quiet and exact, a printed page of record: Tufte's books.
   IDEA    The newspaper agate page: every game a line of type with a sparkline.
   PICTURE Word-sized margin sparklines on one scale per league; a rug of every score.
   COLOUR  Paper and ink; one red-brown for home leads, one slate for away leads; a highlighter for news.
   TYPE    EB Garamond throughout, lining tabular figures for numbers.
   LAYOUT  A text column of tables with a margin of sidenotes (the scoring feed). */
:root {
  color-scheme: light dark;
  --bg: light-dark(#fffff8, #151413);
  --ink: light-dark(#111111, #e8e5dc);
  --gray: light-dark(#6f6d66, #9c998f);
  --rule: light-dark(#d8d5c8, #3b3933);
  --home: light-dark(#9b2d26, #e3867c);
  --away: light-dark(#2e5a87, #8fb5e2);
  --hot: light-dark(#fff0a0, #4b4220);
  --serif: "EB Garamond", "Palatino", "Palatino Linotype", "Book Antiqua", Georgia, serif;
}
:root[data-theme=light] { color-scheme: light; }
:root[data-theme=dark] { color-scheme: dark; }
* { box-sizing: border-box; min-width: 0; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.45 var(--serif); overflow-x: clip;
  font-variant-numeric: lining-nums tabular-nums; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
#pal, [hidden] { display: none !important; }
.wrap { max-width: 1240px; margin: 0 auto; padding: env(safe-area-inset-top, 0px) max(4vw, 16px, env(safe-area-inset-right, 0px)) calc(48px + env(safe-area-inset-bottom, 0px)) max(4vw, 16px, env(safe-area-inset-left, 0px)); }

/* Masthead: the name large on its own line over a rule, then one dateline
   with the status left and the controls right, all on one left edge. */
header { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 0 16px; padding: 18px 0 0; -webkit-app-region: drag; }
header button { -webkit-app-region: no-drag; }
.app header { padding-left: 64px; }
h1 { font-kerning: normal; font-feature-settings: "kern" 1, "liga" 1; }
h1 .kA { letter-spacing: -0.02em; }
h1 { grid-column: 1 / -1; margin: 0 0 0 -0.04em; padding-bottom: 6px; border-bottom: 1px solid var(--ink); font-weight: 500; font-size: clamp(56px, 15vw, 80px); line-height: 1.18; letter-spacing: -0.005em; }
.status { font-style: italic; color: var(--gray); font-size: 15px; padding: 7px 0 0; min-width: 0; }
.status.err { color: var(--home); }
.tools { display: flex; gap: 14px; }
.tools .link { font-size: 15px; min-height: 36px; }
.link { color: var(--gray); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; min-height: 32px; font-size: 16px; }
.link:hover, .link[aria-pressed="true"] { color: var(--ink); text-decoration-color: var(--ink); }
.cta { border: 1px solid var(--ink); padding: 4px 14px; font-size: 16px; min-height: 36px; }
.cta:hover { background: var(--ink); color: var(--bg); }

.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin: 10px 0 4px; padding: 10px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.banner p { margin: 0; flex: 1 1 360px; font-style: italic; color: var(--gray); }
.banner strong { font-style: normal; font-weight: 500; color: var(--ink); }

.rug { margin: 12px 0 4px; }
.rug .cap { font-size: 15px; color: var(--gray); font-style: italic; }
.rug .cap b { font-style: normal; font-weight: 500; color: var(--ink); }
.rug canvas { display: block; width: 100%; height: 54px; }

.leagues { display: flex; flex-wrap: wrap; gap: 2px 20px; padding: 8px 0; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule); }
.league { display: flex; align-items: baseline; gap: 4px; }
.league .pick { font-size: 16px; color: var(--gray); min-height: 34px; letter-spacing: 0.04em; }
.league .pick .n { font-size: 14px; margin-left: 4px; }
.league .pick .n.live { color: var(--home); }
.league .pick:hover, .league.on .pick { color: var(--ink); }
.league.on .pick { text-decoration: underline; text-underline-offset: 5px; }
.league .err { color: var(--home); font-size: 14px; }
.ico { color: var(--rule); display: inline-grid; place-items: center; width: 22px; height: 30px; align-self: center; }
.ico svg { width: 13px; height: 13px; }
.ico:hover { color: var(--gray); }
.ico[aria-pressed="true"] { color: var(--ink); }

.board { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 40px; align-items: start; margin-top: 18px; }
@media (max-width: 960px) { .board { grid-template-columns: minmax(0, 1fr); gap: 24px; } }
h2 { margin: 0 0 2px; font-weight: 400; font-style: italic; font-size: 26px; }
h2 .c { font-style: normal; color: var(--gray); font-size: 18px; margin-left: 6px; }
.note { margin: 0 0 10px; color: var(--gray); font-size: 15px; font-style: italic; }
.group + .group { margin-top: 30px; }
.empty { color: var(--gray); font-style: italic; padding: 20px 0; }

table.agate { border-collapse: collapse; width: 100%; font-size: 16px; }
table.agate th.lg { text-align: left; font-weight: 500; font-size: 14px; letter-spacing: 0.08em; padding: 12px 0 3px; border-bottom: 1px solid var(--ink); }
table.agate th.lg span { font-weight: 400; letter-spacing: 0; color: var(--gray); font-style: italic; margin-left: 8px; }
table.agate td { padding: 3px 6px; white-space: nowrap; vertical-align: middle; border-bottom: 1px solid color-mix(in srgb, var(--rule) 45%, transparent); }
table.agate tr.row { cursor: pointer; }
table.agate tr.row:hover td { background: color-mix(in srgb, var(--rule) 25%, transparent); }
table.agate tr.hot td { animation: hot 6s ease-out both; }
td.tm { width: 1%; font-weight: 500; letter-spacing: 0.03em; }
td.tm.a { padding-left: 0; }
.sw { display: inline-block; width: 4px; height: 15px; margin-right: 6px; vertical-align: -2px; border-radius: 1px; }
.fav { display: inline-flex; align-items: center; gap: 2px; margin-left: 4px; color: var(--gray); font-weight: 400; font-size: 12px; vertical-align: 1px; }
.fav svg { width: 12px; height: 12px; }
.fav span { color: var(--gray); }
td.sc { width: 1%; text-align: right; font-size: 18px; color: var(--gray); }
td.sc.lead { color: var(--ink); font-weight: 600; }
td.sc.h { text-align: left; }
td.sp { width: 168px; padding: 2px 6px; }
td.sp canvas { display: block; width: 156px; height: 24px; }
td.st { width: 1%; font-size: 15px; color: var(--gray); font-style: italic; }
td.st.live { color: var(--ink); font-style: normal; }
td.lp { font-size: 14px; color: var(--gray); max-width: 0; width: 100%; overflow: hidden; text-overflow: ellipsis; }
td.when { width: 1%; color: var(--gray); font-size: 15px; padding-left: 0; }
td.mu { font-weight: 500; }
td.mu .at { font-weight: 400; color: var(--gray); font-style: italic; margin: 0 6px; }
td.mu .rec { font-weight: 400; color: var(--gray); font-size: 14px; margin-left: 4px; }
@media (max-width: 700px) {
  td.lp { display: none; }
  td.sp { width: 96px; } td.sp canvas { width: 88px; }
  td.st { font-size: 14px; }
}
@media (max-width: 560px) {
  td.sp { width: 70px; padding: 2px 3px; } td.sp canvas { width: 64px; }
  table.agate td.st { white-space: normal; min-width: 64px; line-height: 1.2; }
  .fav span { display: none; }
  td.mu .rec { display: none; }
  table.agate td { padding: 3px 3px; }
}

.f1 { margin-bottom: 30px; }
.f1 .ev { cursor: pointer; padding: 6px 0 10px; border-bottom: 1px solid var(--rule); }
.f1 .ev:hover { background: color-mix(in srgb, var(--rule) 25%, transparent); }
.f1 .nm { font-size: 19px; font-weight: 500; }
.f1 .ss { color: var(--gray); font-size: 15px; font-style: italic; }
.f1 .ss b { font-style: normal; font-weight: 500; color: var(--ink); }
.f1 ol { list-style: none; margin: 6px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 0 12px; font-size: 16px; }
.f1 li .p { color: var(--gray); display: inline-block; width: 1.6em; text-align: right; margin-right: 6px; }
.f1 li:first-child { font-weight: 600; }
.f1 .ex { font-size: 13px; color: var(--gray); font-style: italic; }

.feed h2 { font-size: 20px; margin-bottom: 4px; }
.feed ol { list-style: none; margin: 0; padding: 0; max-height: 78vh; overflow-y: auto; }
.feed li { padding: 5px 0 6px; border-top: 1px solid color-mix(in srgb, var(--rule) 60%, transparent); font-size: 15px; line-height: 1.35; }
.feed li:first-child { border-top: 0; }
.feed li.new { animation: hot 6s ease-out both; }
.feed time { color: var(--gray); font-size: 14px; margin-right: 6px; }
.feed .b { font-weight: 600; margin-right: 4px; }
.feed .t { font-weight: 500; }
.feed .t.home { color: var(--home); } .feed .t.away { color: var(--away); }
.feed .l { display: block; color: var(--gray); font-style: italic; font-size: 14px; }
.feed .none { color: var(--gray); font-style: italic; font-size: 15px; margin: 0; }
@media (min-width: 961px) { .feed { position: sticky; top: 16px; } }

.detail { display: grid; gap: 16px; margin-top: 8px; }
.detail .back { justify-self: start; }
.dhead { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 20px; align-items: end; border-bottom: 1px solid var(--ink); padding-bottom: 10px; }
.dteam { display: grid; min-width: 0; }
.dteam.home { text-align: right; justify-items: end; }
.dteam .nm { font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.dteam .big { font-size: clamp(44px, 8vw, 72px); line-height: 1; }
.dteam.away .nm { color: var(--away); } .dteam.home .nm { color: var(--home); }
.dmid { text-align: center; color: var(--gray); font-style: italic; padding-bottom: 8px; }
.dmid .lg { display: block; font-style: normal; letter-spacing: 0.08em; font-size: 14px; color: var(--ink); }
.dmid .live { display: block; font-style: normal; color: var(--ink); font-weight: 500; }
.where { margin: -4px 0 0; display: flex; flex-wrap: wrap; gap: 4px 22px; font-size: 15px; color: var(--ink); }
.where .wk b { font-weight: 400; font-style: italic; color: var(--gray); margin-right: 6px; }
.driver canvas { display: block; width: 100%; height: 200px; }
.dnote { margin: 0; color: var(--gray); font-style: italic; }
.dnote.err { color: var(--home); }
.teams-box { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 36px; align-items: start; }
@media (max-width: 1000px) { .teams-box { grid-template-columns: minmax(0, 1fr); } }
.tbox { display: grid; gap: 16px; }
.tbox h2 { font-style: normal; font-size: 24px; }
.tbox.away h2 { color: var(--away); } .tbox.home h2 { color: var(--home); }
.tbox h3 { margin: 0 0 4px; font-weight: 400; font-style: italic; font-size: 17px; color: var(--gray); }
.scroll { overflow-x: auto; }
table.stats { border-collapse: collapse; width: 100%; font-size: 15px; }
table.stats th, table.stats td { padding: 3px 7px; text-align: right; white-space: nowrap; }
table.stats thead th { font-weight: 400; font-size: 13px; letter-spacing: 0.06em; color: var(--gray); border-bottom: 1px solid var(--ink); }
table.stats .pl { text-align: left; position: sticky; left: 0; background: var(--bg); min-width: 7.5em; max-width: 170px; overflow: hidden; text-overflow: ellipsis; padding-left: 0; }
table.stats td.pl span { color: var(--gray); font-size: 13px; margin-left: 5px; }
table.stats td.lead { font-weight: 600; }
table.stats tr.dnp td { color: var(--gray); }
table.stats tr.dnp td.why { text-align: left; font-style: italic; }
table.stats tr.bench td { color: var(--gray); font-style: italic; text-align: left; padding-top: 8px; }
table.stats tr.tot td { border-top: 1px solid var(--ink); font-weight: 500; }
table.stats .r { text-align: left; }

.back { justify-self: start; position: sticky; top: calc(8px + env(safe-area-inset-top, 0px)); z-index: 5;
  background: var(--ink); color: var(--bg); font-size: 17px; padding: 8px 18px 9px; min-height: 44px; border-radius: 2px;
  box-shadow: 0 0 0 5px var(--bg); }
.back:hover { opacity: 0.85; }
.days { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; padding: 2px 0 8px; }
.days .arrow { min-width: 36px; min-height: 44px; font-size: 26px; line-height: 1; color: var(--gray); }
.days .arrow:hover { color: var(--ink); }
.days .lbl { font-size: 21px; }
.days .arrow:first-child { margin-left: -10px; }
.days input { font: inherit; font-size: 16px; color: var(--gray); background: transparent; border: 1px solid var(--rule); padding: 3px 6px; min-height: 34px; margin-left: 10px; }
.markets { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; max-width: 760px; }
.mk h2 { font-style: normal; font-size: 22px; }
.mk .ev { margin: 8px 0 2px; font-size: 16px; }
.mk .ev a { color: var(--ink); text-decoration-color: var(--rule); text-underline-offset: 3px; }
.mk .ev span { color: var(--gray); font-size: 14px; margin-left: 6px; }
.markets .src { margin: 0; color: var(--gray); font-style: italic; font-size: 15px; }
table.mkt { border-collapse: collapse; width: 100%; font-size: 15px; }
table.mkt td { padding: 4px 8px 4px 0; vertical-align: top; border-bottom: 1px solid color-mix(in srgb, var(--rule) 55%, transparent); }
table.mkt td.q { width: 42%; }
table.mkt td.v { text-align: right; color: var(--gray); white-space: nowrap; font-size: 14px; padding-right: 0; }
table.mkt .o { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
table.mkt .o .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
table.mkt .bar { display: inline-block; height: 7px; background: var(--ink); opacity: 0.5; flex: none; }
table.mkt .pct { font-weight: 500; flex: none; }
.f1 .row2 { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 20px; align-items: start; }
@media (max-width: 520px) { .f1 .row2 { grid-template-columns: minmax(0, 1fr) 96px; gap: 10px; } }
.track svg { display: block; width: 100%; height: auto; }
.track path { fill: none; stroke: var(--ink); stroke-width: 9; stroke-linejoin: round; stroke-linecap: round; }
.track circle { fill: var(--home); }
.track figcaption { font-size: 14px; color: var(--gray); font-style: italic; margin-top: 4px; }
.trackbig { max-width: 380px; }
.racetop { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 20px 40px; align-items: start; }
.racetop .standings { margin-top: 0; }
@media (max-width: 900px) { .racetop { grid-template-columns: minmax(0, 1fr); } .racetop .trackbig { max-width: 300px; } }
.standings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 36px; align-items: start; margin-top: 18px; }
@media (max-width: 700px) { .standings { grid-template-columns: minmax(0, 1fr); } }
.standings h3 { margin: 0 0 4px; font-weight: 400; font-style: italic; font-size: 19px; }
.standings td.who { text-align: left; }
.standings td.gap { color: var(--gray); }
/* The flash after a score, in the scoring team's colour (yellow if unknown). */
@keyframes hot { 0%, 40% { background: var(--hotc, var(--hot)); } 100% { background: transparent; } }
@media (prefers-reduced-motion: reduce) { table.agate tr.hot td, .feed li.new { animation: none; } }
@media (max-width: 600px) {
  .app header { padding-left: 0; }
  .tools .wide { display: none; }
  .leagues { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .leagues::-webkit-scrollbar { display: none; }
  .league { flex: none; }
  .days input { margin-left: auto; }
}
</style>
</head>
<body>
<div id="pal"><i data-k="ink" style="color:var(--ink)"></i><i data-k="gray" style="color:var(--gray)"></i><i data-k="rule" style="color:var(--rule)"></i><i data-k="home" style="color:var(--home)"></i><i data-k="away" style="color:var(--away)"></i><i data-k="bg" style="color:var(--bg)"></i></div>
<div class="wrap">
  <header>
    <h1><span class="kA">A</span>gate</h1>
    <span class="status" id="status">Starting</span>
    <div class="tools">
      <button class="link" id="alerts" type="button" hidden>Alerts</button>
      <button class="link" id="theme" type="button">◐ <span id="theme-v">Auto</span></button>
      <button class="link" id="sound" type="button" aria-pressed="false">Sound off</button>
    </div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <div class="rug">
    <div class="cap" id="rug-cap">Every score in the last 30 minutes</div>
    <canvas id="rug" aria-label="Every score across all leagues in the last 30 minutes"></canvas>
  </div>
  <div class="days" id="days"></div>
  <section class="detail" id="detail" hidden></section>
  <nav class="leagues" id="leagues" aria-label="Leagues"></nav>
  <div class="board" id="board">
    <main id="games"></main>
    <aside class="feed" aria-label="Scoring feed">
      <h2>Scoring</h2>
      <ol id="feed"></ol>
      <p class="none" id="feed-none">Every score lands here as it happens, newest first.</p>
    </aside>
  </div>
</div>

<script>
(function () {
  "use strict";
  // ---- Leagues ---------------------------------------------------------
  // ESPN's public scoreboard feeds; college feeds take groups (80 FBS, 81
  // FCS, 50 Division I) so they carry every game. n, len: periods and
  // seconds per period; up: clock counts up (soccer); innings: baseball;
  // unit: the smallest margin a league's sparklines are scaled to;
  // pl: what a period is called on the game page; race: F1 (sessions and
  // drivers, no score).
  var LEAGUES = [
    { key: "nfl", label: "NFL", paths: ["football/nfl"], sport: "football", bell: true, n: 4, len: 900, unit: 14, pl: "Q" },
    { key: "nba", label: "NBA", paths: ["basketball/nba"], sport: "basketball", bell: false, n: 4, len: 720, unit: 12, pl: "Q" },
    { key: "mlb", label: "MLB", paths: ["baseball/mlb"], sport: "baseball", bell: true, n: 9, innings: true, unit: 4, pl: "" },
    { key: "nhl", label: "NHL", paths: ["hockey/nhl"], sport: "hockey", bell: true, n: 3, len: 1200, unit: 3, pl: "P" },
    { key: "mls", label: "MLS", paths: ["soccer/usa.1"], sport: "soccer", bell: true, n: 2, len: 2700, up: true, unit: 3, pl: "H" },
    { key: "f1", label: "F1", title: "Formula 1", paths: ["racing/f1"], sport: "racing", bell: true, race: true, slow: true },
    { key: "ncaaf", label: "NCAAF", title: "College football, FBS and FCS", slow: true, sport: "football", bell: false, n: 4, len: 900, unit: 14, pl: "Q",
      paths: ["football/college-football?groups=80&limit=500", "football/college-football?groups=81&limit=500"] },
    { key: "ncaam", label: "NCAAM", title: "Men's college basketball, Division I", slow: true, sport: "basketball", bell: false, n: 2, len: 1200, unit: 12, pl: "H",
      paths: ["basketball/mens-college-basketball?groups=50&limit=500"] },
    { key: "ncaaw", label: "NCAAW", title: "Women's college basketball, Division I", slow: true, sport: "basketball", bell: false, n: 4, len: 600, unit: 12, pl: "Q",
      paths: ["basketball/womens-college-basketball?groups=50&limit=500"] },
    { key: "ncaah", label: "NCAAH", title: "College hockey, men's and women's", slow: true, sport: "hockey", bell: false, n: 3, len: 1200, unit: 3, pl: "P",
      paths: ["hockey/mens-college-hockey?limit=500", "hockey/womens-college-hockey?limit=500"] }
  ];
  var BY_KEY = {};
  LEAGUES.forEach(function (l) { BY_KEY[l.key] = l; });
  var LIVE_MS = 15000, IDLE_MS = 60000, SLOW_IDLE_MS = 300000, FLASH_MS = 6000, RUG_MS = 30 * 60000;
  var fetchedAt = {};

  // ESPN's public site API, read straight from the browser. F1 events
  // become weekends of sessions, each with its running order.
  var BASE = "https://site.api.espn.com/apis/site/v2/sports/";
  async function getJSON(url) {
    var r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error("ESPN answered " + r.status);
    return r.json();
  }
  function race(e) {
    var sessions = (e.competitions || []).map(function (c) {
      var st = c.status || {}, t = st.type || {}, ty = c.type || {};
      var res = (c.competitors || []).slice().sort(function (a, b) { return (a.order || 999) - (b.order || 999); }).map(function (x) {
        var a = x.athlete || {}, nm = a.displayName || a.fullName || "";
        var ab = a.abbreviation || (a.lastName || (nm ? nm.split(" ").pop() : "?")).slice(0, 3).toUpperCase();

    if (!view) { d.hidden = true; tablesKey = ""; return; }
    d.hidden = false;
    var l = view.l, ev = findEvent(l, view.id);
    if (l.race) { renderRace(d, l, ev); return; }
    var bx = box.data;
    if (!$("dhead")) {
      d.append(h("button", { class: "back", type: "button", text: "← All games", onclick: function () { location.hash = ""; } }),
        h("div", { id: "dhead" }), h("div", { id: "dwhere" }), h("div", { id: "driver" }), h("div", { class: "markets", id: "dmarkets" }), h("p", { class: "dnote", id: "dnote" }), h("div", { class: "teams-box", id: "dtables" }));
      renderMarkets();
    }
    var s = ev ? sides(ev) : null, bt = (bx && bx.teams) || [];
    var away = s ? s.away : bt.filter(function (t) { return !t.home; })[0] || {};
    var home = s ? s.home : bt.filter(function (t) { return t.home; })[0] || {};
    var state = (ev && ev.state) || (bx && bx.state), detail = (ev && ev.detail) || (bx && bx.detail) || "";
    var tc = ev ? teamColors(ev) : null;
    var dh = $("dhead");
    dh.className = "dhead";
    dh.replaceChildren(
      h("div", { class: "dteam away" }, [h("span", { class: "nm", style: tc ? "color:" + tc.away : null, text: away.full || away.name || "" }), h("span", { class: "big", text: state === "pre" ? "–" : String(away.score == null ? "" : away.score) })]),
      h("div", { class: "dmid" }, [h("span", { class: "lg", text: (ev && ev.example ? "Example. " : "") + l.label }),
        state === "in" ? h("span", { class: "live", text: detail || "Live" }) : h("span", { text: state === "pre" && ev ? whenText(ev.date) : detail || "" })]),
      h("div", { class: "dteam home" }, [h("span", { class: "nm", style: tc ? "color:" + tc.home : null, text: home.full || home.name || "" }), h("span", { class: "big", text: state === "pre" ? "–" : String(home.score == null ? "" : home.score) })]));
    $("dwhere").replaceChildren(ev ? whereLine(ev.media, ev, ev.venue) : "");
    var dr = $("driver"), hs = ev ? hist.get(l.key + ":" + ev.id) : null;
    if (ev && hs && state !== "pre") {
      dr.className = "driver";
      var c = h("canvas", { "aria-label": "Margin over the game; home lead above the line" });
      dr.replaceChildren(c);
      requestAnimationFrame(function () { drawMargin(c, l, ev, hs, leagueScale(l), true, s); });
    } else { dr.className = ""; dr.replaceChildren(); }
    var note = $("dnote");
    note.className = "dnote" + (box.error ? " err" : "");
    if (box.error) note.textContent = "Couldn't load the box score: " + box.error;
    else if (box.loading && !bx) note.textContent = "Loading players…";
    else if (bx && !bt.some(function (t) { return t.groups && t.groups.length; })) note.textContent = state === "pre" ? "Player stats start when the game does." : "ESPN has no player stats for this game yet.";
    else if (bx) note.textContent = (state === "in" ? "Live box score, refreshed every 15 s, " : "Box score, ") + "updated " + new Date(box.at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" }) + ". Bars show each figure against the game's best; the leader is in bold.";
    else note.textContent = "";
    if (!tablesToo || !bx) return;
    var key = box.key + ":" + box.at + ":" + (P ? P.ink : "");
    if (key === tablesKey) return;
    tablesKey = key;
    var ordered = bt.slice().sort(function (a, b) { return (a.home ? 1 : 0) - (b.home ? 1 : 0); });
    var scale = boxScale(ordered), p = pal();
    $("dtables").replaceChildren.apply($("dtables"), ordered.filter(function (t) { return t.groups && t.groups.length; }).map(function (t) {
      var which = t.home ? "home" : "away", base = tc ? tc[which] : p[which], color = alpha(base, 0.14);
      return h("section", { class: "tbox " + which }, [h("h2", { style: "color:" + base, text: t.name || t.abbr || "" })].concat(t.groups.map(function (g) {
        var title = ({ Kickreturns: "Kick returns", Puntreturns: "Punt returns", Defenses: "Defense", Defensive: "Defense" })[g.name] || g.name;
        return h("div", null, [h("h3", { text: title }), statTable(g, color, scale)]);
      })));
    }));
  }

  // ---- App setup ---------------------------------------------------------
  $("sound").addEventListener("click", function () {
    prefs.sound = !prefs.sound; savePrefs();
    if (prefs.sound && !audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (prefs.sound && audio && audio.state === "suspended") audio.resume();
    soundButton(); if (prefs.sound) chime(1);
  });
  // Theme: auto follows the phone; light and dark override it on this device.
  function applyTheme() {
    var t = prefs.theme === "light" || prefs.theme === "dark" ? prefs.theme : null;
    if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme");
    $("theme-v").textContent = t ? t[0].toUpperCase() + t.slice(1) : "Auto";
    var dark = t ? t === "dark" : !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", dark ? "#151413" : "#fffff8");
  }
  $("theme").addEventListener("click", function () {
    prefs.theme = ({ auto: "light", light: "dark", dark: "auto" })[prefs.theme] || "light"; savePrefs(); applyTheme();
  });
  applyTheme();
  function soundButton() { var s = $("sound"); s.setAttribute("aria-pressed", String(prefs.sound)); s.textContent = prefs.sound ? "Sound on" : "Sound off"; }
  soundButton();
  $("alerts").addEventListener("click", function () {
    if (!("Notification" in window)) return;
    Notification.requestPermission().then(renderAlertsButton).catch(function () {});
  });
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { clearTimeout(timer); poll(); } });

  setInterval(function () { if (mode === "live") renderStatus(); drawRug(); }, 1000);
  var rt = null;
  window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(render, 150); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { render(); });

  window.addEventListener("hashchange", route);
  route();
  poll();
  loadCircuits();
  loadStandings();
  setInterval(function () { if (!document.hidden && Date.now() - standingsAt > 600000) loadStandings(); }, 60000);
})();
</script>
