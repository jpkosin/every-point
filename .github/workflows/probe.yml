name: probe
on: push
jobs:
  p:
    if: github.ref == 'refs/heads/probe'
    runs-on: ubuntu-latest
    steps:
      - shell: python
        run: |
          import json, urllib.request
          def get(u):
              r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0", "Origin": "https://jpkosin.github.io"}), timeout=30)
              return json.loads(r.read()), dict(r.headers)
          J = "https://api.jolpi.ca/ergast/f1/"
          d, h = get(J + "2026.json"); rs = d["MRData"]["RaceTable"]["Races"]; print("ROUNDS", [(r["round"], r["raceName"], r["date"]) for r in rs[-4:]])
          d, h = get(J + "2026/20/laps.json?limit=2000"); m = d["MRData"]; print("LAPS total", m["total"], "limit", m["limit"], "offset", m["offset"], "ACAO", h.get("Access-Control-Allow-Origin"), {k: v for k, v in h.items() if "ate" in k.lower() or "limit" in k.lower()})
          L = m["RaceTable"]["Races"][0]["Laps"]; print("nlaps in page", len(L), [len(x["Timings"]) for x in L][:5], json.dumps(L[0]["Timings"][:2]))
          d, h = get(J + "2026/20/laps.json?limit=100&offset=100"); L = d["MRData"]["RaceTable"]["Races"][0]["Laps"]; print("page2", [(x["number"], len(x["Timings"])) for x in L][:6])
          d, h = get(J + "2026/20/pitstops.json?limit=100"); m = d["MRData"]; print("PITS total", m["total"], json.dumps(m["RaceTable"]["Races"][0]["PitStops"][:2]))
          d, h = get(J + "2026/20/results.json"); r = d["MRData"]["RaceTable"]["Races"][0]["Results"]; print("RES laps", r[0]["laps"], r[0].get("Time"), r[0]["status"])
          d, h = get(J + "2026/driverstandings.json"); s = d["MRData"]["StandingsTable"]["StandingsLists"][0]; print("STAND round", s["round"], [(x["Driver"]["code"], x["points"]) for x in s["DriverStandings"][:5]])
          try:
              d, h = get(J + "2026/21/results.json"); print("QATAR results", len(d["MRData"]["RaceTable"]["Races"]))
              d, h = get(J + "2026/21/sprint.json"); print("QATAR sprint", len(d["MRData"]["RaceTable"]["Races"]))
          except Exception as e: print("Q err", e)
          for u in ["https://site.api.espn.com/apis/site/v2/sports/racing/f1/scoreboard"]:
              d, h = get(u); e = d["events"][0]; print("ESPN", e["name"], [ (c.get("type",{}).get("abbreviation"), c.get("status",{}).get("type",{}).get("state")) for c in e["competitions"]])
              c = [c for c in e["competitions"] if c.get("status",{}).get("type",{}).get("state") != "pre"]
              if c: print("ESPN COMP keys", list(c[-1].keys())); print(json.dumps(c[-1]["competitors"][0])[:800])
