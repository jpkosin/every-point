name: probe
on:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: python
        run: |
          import json, urllib.request, urllib.parse
          def get(u): return json.loads(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=25).read())
          for q in ["Arsenal", "Real Madrid", "Bayern", "Inter", "PSG", "Club America", "Champions League Liverpool", "Las Vegas Aces", "Portland Thorns"]:
            r = get("https://gamma-api.polymarket.com/public-search?q=" + urllib.parse.quote(q) + "&limit_per_type=8&events_status=active")
            print("==", q)
            for e in (r.get("events") or [])[:8]:
              ms = e.get("markets") or []
              print("  ", e.get("slug"), "|", e.get("title"), "| negRisk", e.get("negRisk"), "| n", len(ms), "|", [(m.get("groupItemTitle"), m.get("outcomes"), m.get("sportsMarketType")) for m in ms[:4]])
          for lg in ["soccer/eng.1", "soccer/uefa.champions", "soccer/usa.nwsl", "basketball/wnba", "soccer/mex.1"]:
            d = get("https://site.api.espn.com/apis/site/v2/sports/" + lg + "/scoreboard")
            ev = d.get("events") or []
            print("ESPN", lg, len(ev), [(e.get("shortName"), e.get("date")) for e in ev[:3]])
