name: probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        shell: python
        run: |
          import json, urllib.request
          URLS = [
            "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard",
            "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=20261123",
            "https://site.api.espn.com/apis/site/v2/sports/racing/f1/scoreboard",
            "https://gamma-api.polymarket.com/public-search?q=Chiefs%20Cowboys&limit_per_type=5",
            "https://gamma-api.polymarket.com/events?tag_slug=nfl&active=true&closed=false&limit=3&order=volume&ascending=false",
            "https://gamma-api.polymarket.com/events?slug=nfl-kc-dal-2026-11-26",
            "https://api.elections.kalshi.com/trade-api/v2/events?series_ticker=KXNFLGAME&status=open&with_nested_markets=true&limit=2",
            "https://api.elections.kalshi.com/trade-api/v2/series?category=Sports",
          ]
          def short(o, d=0):
            if d > 4: return "…"
            if isinstance(o, dict): return {k: short(v, d+1) for k, v in list(o.items())[:40]}
            if isinstance(o, list): return [short(v, d+1) for v in o[:2]] + ([f"+{len(o)-2} more"] if len(o) > 2 else [])
            if isinstance(o, str) and len(o) > 120: return o[:120] + "…"
            return o
          for u in URLS:
            print("=====", u)
            try:
              req = urllib.request.Request(u, headers={"Origin": "https://jpkosin.github.io", "User-Agent": "Mozilla/5.0"})
              r = urllib.request.urlopen(req, timeout=25)
              print("status", r.status, "ACAO:", r.headers.get("Access-Control-Allow-Origin"))
              body = json.loads(r.read())
              if "series" in u and "series?" in u:
                print([ (s.get("ticker"), s.get("title")) for s in body.get("series", []) if "GAME" in (s.get("ticker") or "") or "F1" in (s.get("ticker") or "") or "RACE" in (s.get("ticker") or "")][:80])
              else:
                print(json.dumps(short(body), indent=1)[:6000])
            except Exception as e:
              print("ERR", e, getattr(e, "headers", {}) and e.headers.get("Access-Control-Allow-Origin"))
