name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: python
        run: |
          import json, urllib.request
          S="https://site.api.espn.com/apis/site/v2/sports/football/"
          get=lambda u: json.loads(urllib.request.urlopen(u, timeout=30).read())
          for lg in ["college-football","nfl"]:
            sb=get(S+lg+"/scoreboard?groups=80&limit=300" if lg!="nfl" else S+lg+"/scoreboard")
            live=[e for e in sb["events"] if e["status"]["type"]["state"]=="in"]
            print(lg, "live", len(live))
            for e in live[:2]:
              c=e["competitions"][0]
              print("TEAMS", [(x["homeAway"], x["team"]["id"], x["team"]["abbreviation"]) for x in c["competitors"]])
              print("SITUATION", json.dumps(c.get("situation"))[:900])
            if live:
              e=live[0]; d=get(S+lg+"/summary?event="+e["id"])
              print("SUMMARY KEYS", list(d.keys()))
              dr=d.get("drives",{})
              print("DRIVES keys", list(dr.keys()))
              prev=dr.get("previous",[])
              print("n prev", len(prev))
              if prev:
                p=prev[0]; print("DRIVE KEYS", list(p.keys()))
                print(json.dumps({k:p[k] for k in p if k not in ("plays",)})[:1500])
                if p.get("plays"): print("PLAY", json.dumps(p["plays"][0])[:900])
              cur=dr.get("current")
              if cur: print("CURRENT", json.dumps({k:cur[k] for k in cur if k!="plays"})[:1200])
              print("SITUATION summary", json.dumps(d.get("situation"))[:600])
              wp=d.get("winprobability",[]); print("WP n", len(wp), json.dumps(wp[-1:])[:300])
              break
