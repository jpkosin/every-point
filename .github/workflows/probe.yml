name: probe
on:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: python
        run: |
          import json, urllib.request
          for u in ["https://api.jolpi.ca/ergast/f1/current/last/results.json", "https://api.jolpi.ca/ergast/f1/2026/qualifying.json?limit=1", "https://api.jolpi.ca/ergast/f1/current.json"]:
            try:
              r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0", "Origin": "https://jpkosin.github.io"}), timeout=30)
              print("==", u, "status", r.status, "ACAO", r.headers.get("Access-Control-Allow-Origin"))
              d = json.loads(r.read())["MRData"]
              if "RaceTable" in d:
                rs = d["RaceTable"]["Races"]
                print(" races", len(rs), [(x.get("round"), x.get("raceName"), x.get("date")) for x in rs[-3:]])
                if rs and rs[-1].get("Results"):
                  for x in rs[-1]["Results"][:3] + rs[-1]["Results"][-2:]: print(json.dumps(x)[:700])
            except Exception as ex: print("ERR", u, ex)
