name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set +e
          S=https://site.api.espn.com/apis/site/v2/sports
          curl -s "$S/football/nfl/teams/8/schedule" > a.json
          curl -s "$S/soccer/eng.1/teams/359/schedule" > b.json
          curl -s "$S/soccer/eng.1/teams/359/schedule?fixture=true" > c.json
          curl -s -D h.txt -o d.json "https://site.api.espn.com/apis/v2/sports/soccer/eng.1/standings"; grep -i access-control h.txt
          curl -s -D h2.txt -o e.json "$S/basketball/nba/teams/8/roster"; grep -i access-control h2.txt
          python3 - <<'PY'
          import json
          a=json.load(open('a.json')); ev=a['events']
          c=ev[0]['competitions'][0]
          print(json.dumps(c['competitors'][0]['score']), json.dumps(c['competitors'][0]['leaders'])[:900])
          print(json.dumps(c['competitors'][0]['team'])[:400]); print(json.dumps(c['competitors'][0]['record'])[:300])
          print(json.dumps(c['status']['type'])); print(json.dumps(c['broadcasts'])[:300])
          fut=[e for e in ev if e['competitions'][0]['status']['type']['state']=='pre']
          print('pre', len(fut), json.dumps(fut[0]['competitions'][0]['competitors'][1])[:500] if fut else '')
          for f in ('b.json','c.json'):
              d=json.load(open(f)); e=d.get('events',[]); print(f, len(e), [x['competitions'][0]['status']['type']['state'] for x in e][:40]); print(d['team'].get('standingSummary'), d['team'].get('recordSummary'), json.dumps(d['team'].get('groups')))
          d=json.load(open('d.json')); print(list(d.keys()), [ (c.get('name'), len(c.get('standings',{}).get('entries',[]))) for c in d.get('children',[])][:3])
          ent=(d.get('children') or [d])[0]['standings']['entries'][0]; print([ (s['name'], s.get('displayValue')) for s in ent['stats']])
          PY
