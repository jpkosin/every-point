name: probe
on:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: python
        run: |
          import json, urllib.request
          def get(u): return json.loads(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=30).read())
          seen = {}
          for grp in ("80", "81"):
            d = get("https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=%s&limit=500&week=13&seasontype=2" % grp)
            for e in d.get("events", []):
              for c in e["competitions"][0]["competitors"]:
                t = c["team"]; cid = t.get("conferenceId")
                seen.setdefault((grp, cid), set()).add(t.get("abbreviation"))
          for k in sorted(seen, key=lambda k: (k[0], int(k[1] or 0))): print(k, sorted(seen[k])[:8])
          for u in ["https://site.api.espn.com/apis/site/v2/sports/football/college-football/groups?groups=80",
                    "https://site.api.espn.com/apis/site/v2/sports/football/college-football/groups?groups=81",
                    "https://site.api.espn.com/apis/site/v2/sports/hockey/mens-college-hockey/groups",
                    "https://site.api.espn.com/apis/site/v2/sports/basketball/womens-college-basketball/groups"]:
            try:
              g = get(u); print("==", u.split("sports/")[1])
              def walk(x, depth=0):
                for gg in x.get("groups", x.get("children", [])) or []:
                  print("  " * depth, gg.get("name"), "|", gg.get("abbreviation"), "| teams", len(gg.get("teams") or []))
                  walk(gg, depth + 1)
              walk(g)
            except Exception as ex: print("ERR", u, ex)
          # does the basketball groups list carry team ids that match conferenceId?
          g = get("https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/groups")
          c0 = g["groups"][0]["children"][0]; print("ncaam child keys", list(c0.keys()), c0.get("name"))
