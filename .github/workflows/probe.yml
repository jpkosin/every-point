name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set +e
          S=https://site.api.espn.com/apis/site/v2/sports
          for u in "$S/football/nfl/teams" "$S/basketball/nba/teams" "$S/football/college-football/teams?limit=1000" "$S/soccer/eng.1/teams" "https://site.api.espn.com/apis/v2/sports/football/nfl/standings" "https://site.api.espn.com/apis/v2/sports/basketball/nba/standings"; do
            curl -s -D h.txt -o b.json -H "Origin: https://jpkosin.github.io" "$u"; echo "== $u $(grep -i 'access-control-allow-origin' h.txt | tr -d '\r')"
            python3 -c "
          import json; d=json.load(open('b.json'))
          if 'sports' in d:
            t=d['sports'][0]['leagues'][0]['teams']; print(len(t), json.dumps(t[0]['team'])[:260])
          else:
            def walk(n,dep=0):
              print('  '*dep, n.get('name'), len((n.get('standings') or {}).get('entries',[])))
              for c in n.get('children',[]): walk(c,dep+1)
            walk(d)
          "
          done
