name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: python
        run: |
          import json, urllib.request, collections
          S="https://site.api.espn.com/apis/site/v2/sports/basketball/nba/"
          get=lambda u: json.loads(urllib.request.urlopen(u, timeout=30).read())
          sb=get(S+"scoreboard"); live=[e for e in sb["events"] if e["status"]["type"]["state"]=="in"]
          print("live", len(live))
          e=live[0] if live else sb["events"][0]; c=e["competitions"][0]
          print("SB SITUATION", json.dumps(c.get("situation"))[:500])
          print("SB comp keys", list(c.keys()))
          d=get(S+"summary?event="+e["id"]); print("KEYS", list(d.keys()))
          pl=d.get("plays",[]); print("plays", len(pl))
          shots=[p for p in pl if p.get("shootingPlay")]; print("shots", len(shots))
          for p in shots[:3]: print(json.dumps({k:p.get(k) for k in ("text","type","scoringPlay","scoreValue","coordinate","team","period","clock","awayScore","homeScore","participants","pointsAttempted")})[:600])
          print("coord sample", [s.get("coordinate") for s in shots[:12]])
          ft=[p for p in pl if "free throw" in (p.get("text") or "").lower()][:1]; print("FT", json.dumps(ft)[:300])
          bs=d.get("boxscore",{}).get("teams",[])
          if bs: print("TEAM STATS", [(s.get("name"), s.get("displayValue")) for s in bs[0].get("statistics",[])])
          wp=d.get("winprobability",[]); print("WP", len(wp))
          print("types", collections.Counter((p.get("type") or {}).get("text") for p in pl).most_common(25))
